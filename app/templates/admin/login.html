<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Daily AI Mentor Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0E1F;
            --surface: #151A38;
            --border-soft: #1E2444;
            --text: #ECEEFA;
            --text-dim: #9AA0C2;
            --text-faint: #6870A0;
            --accent: #5EEAD4;
            --violet: #9B8CFF;
            --red: #FF6B6B;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(at 30% 20%, rgba(155, 140, 255, 0.12) 0px, transparent 50%),
                radial-gradient(at 70% 80%, rgba(94, 234, 212, 0.08) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 1rem;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 14px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-emoji {
            font-size: 3rem;
            display: block;
            text-align: center;
            margin-bottom: 0.75rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            text-align: center;
            margin-bottom: 0.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            text-align: center;
            color: var(--text-faint);
            font-size: 0.8rem;
            margin-bottom: 2rem;
        }

        .alert {
            padding: 0.75rem 1rem;
            border-radius: 9px;
            margin-bottom: 1.25rem;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(255, 107, 107, 0.12);
            border: 1px solid rgba(255, 107, 107, 0.25);
            color: #fca5a5;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border-radius: 9px;
            border: 1px solid var(--border-soft);
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 2px rgba(155, 140, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--violet), var(--accent));
            color: #0B0E1F;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(155, 140, 255, 0.35);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-emoji">🤖</div>
            <h2>Admin Login</h2>
            <p class="subtitle">Daily AI Mentor Dashboard</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Sign In to Dashboard</button>
            </form>
        </div>
    </div>
</body>
</html>
